name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - run: pip install -r ../requirements.txt

      - name: Run backend test suite
        # REDIS_URL intentionally points at "localhost" — agents/base.py
        # treats that as "no real Redis available" and falls back to an
        # in-memory mock, so the unit-test suite doesn't need a Redis
        # service container (docker-compose covers real Redis/Celery
        # integration for local/manual testing).
        env:
          DATABASE_URL: sqlite:///./ci_test.db
          REDIS_URL: redis://localhost:6379/0
          OPENAI_API_KEY: ""
          AWS_S3_BUCKET: ""
        run: pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build all service images (validates Dockerfiles, no push)
        run: docker compose build
